services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      - ./otel-data:/otel-data
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
