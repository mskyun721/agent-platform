name: Platform Tests

on:
  push:
    branches: [main, refactor/agent-platform-evolution]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11.12"
      - name: Install locked dependencies
        run: uv --directory mcp-server sync --locked --dev
      - name: Run platform and evaluator regressions
        run: uv --directory mcp-server run --locked --dev python -m pytest -q ../tests
      - name: Generated host adapters are in sync
        run: python3 scripts/sync_claude_settings.py --check
      - name: Fresh-checkout setup works and is re-runnable
        run: |
          mkdir -p "$RUNNER_TEMP/projects/sample-service"
          ./scripts/setup.sh --roots "$RUNNER_TEMP/projects" --target "$RUNNER_TEMP/projects/sample-service"
          test -f .claude/skills/ponytail/SKILL.md && test -f .agents/skills/ponytail/SKILL.md
          grep -qx "$RUNNER_TEMP/projects/sample-service" .active-project
          ./scripts/setup.sh
